name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$tag_version" = "$project_version"

      - name: Build
        run: ./gradlew clean build --warning-mode all

      - name: Create checksums
        shell: bash
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/libs/torcherino-*.jar \
            build/libs/SHA256SUMS \
            --verify-tag \
            --title "Torcherino ${GITHUB_REF_NAME#v}" \
            --generate-notes
